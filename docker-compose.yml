services:
  content-filter-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    restart: unless-stopped
    networks:
      - content-filter-network

  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    ports:
      - "8090:8090"
      - "8081:8081"
    command: >
      mitmdump
      --listen-host 0.0.0.0
      --listen-port 8090
      --web-host 0.0.0.0
      --web-port 8081
      --scripts /scripts
    volumes:
      - ./.scripts:/scripts
      - ./certs:/home/mitmproxy/.mitmproxy
    restart: unless-stopped
    networks:
      - content-filter-network

networks:
  content-filter-network: